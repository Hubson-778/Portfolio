<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seeds Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      max-width: 100%;
      display: block;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 20px;
      border: 2px solid #222;
      background: #222;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #444; }
    p {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="btnReplay">↺ Replay</button>
  </div>
  <p>Record with <a href="https://www.screentogif.com/" target="_blank">ScreenToGif</a> to export as GIF</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    const IMG_SRC = '432423.png'; // put 432423.png in the same folder as this HTML

    // ── Seed spawn positions (x, y as fractions of image width/height)
    // These match the approximate positions of each seed in the photo.
    const SEED_DATA = [
      { x: 0.62, y: 0.18 },
      { x: 0.70, y: 0.12 },
      { x: 0.78, y: 0.10 },
      { x: 0.85, y: 0.14 },
      { x: 0.90, y: 0.20 },
      { x: 0.93, y: 0.28 },
      { x: 0.88, y: 0.35 },
      { x: 0.82, y: 0.40 },
      { x: 0.75, y: 0.44 },
      { x: 0.68, y: 0.48 },
      { x: 0.60, y: 0.52 },
      { x: 0.58, y: 0.42 },
      { x: 0.55, y: 0.30 },
      { x: 0.60, y: 0.22 },
      { x: 0.65, y: 0.35 },
      { x: 0.72, y: 0.30 },
      { x: 0.80, y: 0.25 },
      { x: 0.87, y: 0.45 },
      { x: 0.92, y: 0.55 },
      { x: 0.78, y: 0.55 },
      { x: 0.70, y: 0.60 },
      { x: 0.63, y: 0.58 },
      { x: 0.85, y: 0.60 },
      { x: 0.90, y: 0.65 },
    ];

    // Hand target (his outstretched fingertips) — fraction of image
    const HAND_TARGET = { x: 0.38, y: 0.28 };

    const DURATION = 1800; // ms for one full cycle
    const HOLD     = 400;  // ms to hold at rest before looping

    let img = new Image();
    let seeds = [];
    let startTime = null;
    let animId = null;
    let W, H;

    img.onload = () => {
      W = img.naturalWidth;
      H = img.naturalHeight;
      canvas.width  = W;
      canvas.height = H;
      initSeeds();
      startTime = performance.now();
      if (animId) cancelAnimationFrame(animId);
      loop(performance.now());
    };
    img.src = IMG_SRC;

    function initSeeds() {
      seeds = SEED_DATA.map((d, i) => ({
        startX: d.x * W,
        startY: d.y * H,
        targetX: HAND_TARGET.x * W,
        targetY: HAND_TARGET.y * H,
        // Stagger: outer seeds start moving a bit later
        delay: (i / SEED_DATA.length) * 0.3,
        // Each seed spins as it flies
        angle: Math.random() * Math.PI * 2,
        spinSpeed: (Math.random() - 0.5) * 0.12,
        // Seed size proportional to image
        w: W * 0.055,
        h: W * 0.025,
      }));
    }

    // Ease-in cubic: starts slow, snaps to hand
    function easeIn(t) {
      return t * t * t;
    }

    // Ease-out for a nice decelerate feel on some
    function easeInOut(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function drawSeed(x, y, angle, w, h, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Seed body — dark grey ellipse with a gold rim hint
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.5);
      grad.addColorStop(0,   '#888');
      grad.addColorStop(0.6, '#555');
      grad.addColorStop(1,   '#c8a050');

      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Stripe down the middle
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.5);
      ctx.lineTo(0,  h * 0.5);
      ctx.strokeStyle = 'rgba(200,180,80,0.4)';
      ctx.lineWidth = w * 0.04;
      ctx.stroke();

      ctx.restore();
    }

    function loop(now) {
      if (!startTime) startTime = now;
      const elapsed = now - startTime;
      const cycleDur = DURATION + HOLD;
      const t_raw = (elapsed % cycleDur) / DURATION; // 0→1 within movement phase
      const t = Math.min(t_raw, 1);

      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(img, 0, 0);

      seeds.forEach((s) => {
        // Apply per-seed delay
        const tLocal = Math.max(0, (t - s.delay) / (1 - s.delay));
        const tEased = easeIn(Math.min(tLocal, 1));

        const x = s.startX + (s.targetX - s.startX) * tEased;
        const y = s.startY + (s.targetY - s.startY) * tEased;

        // Fade out as they reach the hand
        const alpha = tEased < 0.85 ? 1 : 1 - (tEased - 0.85) / 0.15;

        // Shrink slightly as they converge
        const scale = 1 - tEased * 0.4;

        s.angle += s.spinSpeed * (1 - tEased); // slow spin as they approach

        drawSeed(x, y, s.angle, s.w * scale, s.h * scale, alpha);
      });

      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnReplay').onclick = () => {
      startTime = performance.now();
    };
  </script>
</body>
</html>
